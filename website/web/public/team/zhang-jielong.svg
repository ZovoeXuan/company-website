<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae3d5"/>
      <stop offset="100%" stop-color="#e3b69e"/>
    </linearGradient>
    <linearGradient id="hair4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg4)"/>
  <circle cx="200" cy="180" r="160" fill="url(#glow4)"/>

  <!-- Subtle tech grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
  </g>

  <!-- Shoulders & Suit -->
  <path d="M70,500 L110,335 L160,315 L240,315 L290,335 L330,500 Z" fill="url(#suit4)"/>
  <!-- Lapels -->
  <path d="M160,315 L200,425 L175,500 L110,335 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <path d="M240,315 L200,425 L225,500 L290,335 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <!-- Shirt -->
  <polygon points="175,315 225,315 200,405" fill="#f8fafc"/>
  <!-- Tie (Finance green / teal) -->
  <polygon points="194,325 206,325 203,395 197,395" fill="#059669"/>

  <!-- Neck -->
  <rect x="180" y="245" width="40" height="75" fill="url(#skin4)" rx="8"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="185" rx="64" ry="78" fill="url(#skin4)"/>

  <!-- Ears -->
  <ellipse cx="136" cy="190" rx="9" ry="17" fill="#e3b69e"/>
  <ellipse cx="264" cy="190" rx="9" ry="17" fill="#e3b69e"/>

  <!-- Hair (Clean neat finance crop) -->
  <path d="M136,170 C132,108 165,98 200,98 C235,98 268,108 264,170 C252,138 230,125 200,125 C170,125 148,138 136,170 Z" fill="url(#hair4)"/>

  <!-- Eyes & Eyebrows -->
  <ellipse cx="172" cy="182" rx="4.5" ry="4" fill="#0f172a"/>
  <ellipse cx="228" cy="182" rx="4.5" ry="4" fill="#0f172a"/>
  <path d="M156,166 Q172,162 186,166" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <path d="M214,166 Q228,162 244,166" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose & Calm Executive Smile -->
  <path d="M198,185 L196,208 L204,208" fill="none" stroke="#c48e72" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M185,232 Q200,240 215,232" fill="none" stroke="#a36e52" stroke-width="3" stroke-linecap="round"/>

  <!-- Name Badge overlay at bottom -->
  <rect x="20" y="445" width="360" height="40" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#1e293b" stroke-width="1"/>
  <text x="35" y="470" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700">张杰龙</text>
  <text x="95" y="470" fill="#6ee7b7" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" font-size="13">G7易流首席财务官 (CFO)</text>
</svg>
