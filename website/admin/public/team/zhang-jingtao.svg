<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0b0f17"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="suit2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fae0d0"/>
      <stop offset="100%" stop-color="#e3b49a"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg2)"/>
  <circle cx="200" cy="180" r="160" fill="url(#glow2)"/>

  <!-- Subtle tech grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="120" x2="400" y2="120"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="360" x2="400" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
  </g>

  <!-- Shoulders & Suit -->
  <path d="M70,500 L110,335 L160,315 L240,315 L290,335 L330,500 Z" fill="url(#suit2)"/>
  <!-- Lapels -->
  <path d="M160,315 L200,425 L175,500 L110,335 Z" fill="#111827" stroke="#4b5563" stroke-width="1"/>
  <path d="M240,315 L200,425 L225,500 L290,335 Z" fill="#111827" stroke="#4b5563" stroke-width="1"/>
  <!-- Shirt -->
  <polygon points="175,315 225,315 200,405" fill="#f3f4f6"/>
  <!-- Tie -->
  <polygon points="194,325 206,325 203,395 197,395" fill="#0284c7"/>

  <!-- Neck -->
  <rect x="180" y="245" width="40" height="75" fill="url(#skin2)" rx="8"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="185" rx="66" ry="82" fill="url(#skin2)"/>

  <!-- Ears -->
  <ellipse cx="134" cy="190" rx="10" ry="18" fill="#e3b49a"/>
  <ellipse cx="266" cy="190" rx="10" ry="18" fill="#e3b49a"/>

  <!-- Hair (Side part executive style) -->
  <path d="M134,170 C130,105 165,95 205,95 C245,95 268,110 266,170 C250,135 225,122 195,122 C165,122 142,138 134,170 Z" fill="url(#hair2)"/>

  <!-- Eyes & Eyebrows -->
  <ellipse cx="172" cy="182" rx="4.5" ry="4" fill="#111827"/>
  <ellipse cx="228" cy="182" rx="4.5" ry="4" fill="#111827"/>
  <path d="M154,166 Q172,160 188,165" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M212,165 Q228,160 246,166" fill="none" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Nose & Confident Smile -->
  <path d="M198,185 L196,210 L204,210" fill="none" stroke="#c28c70" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M184,232 Q200,242 216,232" fill="none" stroke="#a86d4e" stroke-width="3" stroke-linecap="round"/>

  <!-- Name Badge overlay at bottom -->
  <rect x="20" y="445" width="360" height="40" rx="8" fill="#0b0f19" fill-opacity="0.8" stroke="#374151" stroke-width="1"/>
  <text x="35" y="470" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700">张景涛</text>
  <text x="95" y="470" fill="#9ca3af" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,sans-serif" font-size="13">G7易流总裁</text>
</svg>
