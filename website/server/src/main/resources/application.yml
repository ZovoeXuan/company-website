server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: false
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: company-website-server
  datasource:
    url: "${CMS_DB_URL:jdbc:mysql://127.0.0.1:3306/cms_dev?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    username: "${CMS_DB_USER:cms_app}"
    password: "${CMS_DB_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: "${CMS_DB_URL:jdbc:mysql://127.0.0.1:3306/cms_dev?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}"
    user: "${CMS_MIGRATION_USER:cms_migrator}"
    password: "${CMS_MIGRATION_PASSWORD:}"
    baseline-on-migrate: false
    validate-on-migrate: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.company.cms: INFO

cms:
  media:
    root: "${CMS_MEDIA_ROOT:./data/media}"
  security:
    login:
      max-failures: 5
      window-minutes: 5
      lock-minutes: 10
  init:
    username: "${CMS_INIT_USERNAME:}"
    password: "${CMS_INIT_PASSWORD:}"
